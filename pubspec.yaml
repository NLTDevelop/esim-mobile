name: esim_mob_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: 3.29.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5
  bloc_concurrency: ^0.2.5
  freezed_annotation: ^2.4.1
  go_router: ^15.0.0
  dio: ^5.4.3+1
  talker_bloc_logger: ^4.2.3
  talker: ^4.2.3
  talker_dio_logger: ^4.2.3
  logger: ^2.3.0
  talker_flutter: ^4.2.3
  retrofit: ^4.1.0
  get_it: ^7.7.0
  equatable: ^2.0.7
  theme_tailor: ^3.0.1
  flutter_svg: ^2.2.1
  connectivity_plus: ^7.0.0
  flutter_bounce: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2
  clipboard: ^2.0.2
  webview_flutter: ^4.13.0
  intl: ^0.19.0
  flutter_localization: ^0.3.3
  flutter_stripe: ^11.5.0
  country_codes: ^3.3.0
  tutorial_coach_mark: ^1.3.3
  rxdart: ^0.28.0
  haptic_feedback: ^0.5.1+1
  permission_handler: ^12.0.1
  flutter_svg_provider: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  go_router_builder: ^2.7.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0



# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # example:
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
          style: normal
          weight: 300
        - asset: assets/fonts/Quicksand-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          style: normal
          weight: 600
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
